<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="script.js" type="module"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body style="background-color: grey;">
    
    <div class="main-box">
        <h1>WEATHER  INFO BY CITY NAME</h1>
        <div class="top-box">
            <div><input type="text" placeholder="Enter city name" class="input">
            <button class="input-active">&#128269;</button></div>
            <div class="errorbox"></div>
            <div class="spinner">Loading...</div>
        </div>
        <div class="hidebox">
        <main class="main">
            <img src="" alt="" class="imgbox">
            <div class="temperature">40℃</div>
            <div class="cityname">Patna</div>
        </main>
        <div class="details">
            <div class="col">
                <img src="" alt="">
                <div>
                <div class="time">2</div>
                <div class="date">2</div>
                </div>
            </div>
            <div class="col">
                <img src="" alt="">
                <div>
                    <p class="humidity">50%</p>
                    <p>humidity</p>
                </div>
            </div>
            <div class="col">
                <img src="" alt="">
                <div>
                    <p class="wind">50km/h</p>
                    <p>Wind speed</p>
                </div>
            </div>
            <div class="col">
                <img src="" alt="">
                <div>
                    <p class="feellike">50c</p>
                    <p>Feels like</p>
                </div>
            </div>
            <div class="col">
                <img src="" alt="">
                <div>
                    <p class="surise">22</p>
                    <p>Sunrise</p>
                </div>
            </div>
            <div class="col">
                <img src="" alt="">
                <div>
                    <p class="Sunset">50</p>
                    <p>Sunset</p>
                </div>
            </div>
        </div></div>
    </div>
</body>

</html>
