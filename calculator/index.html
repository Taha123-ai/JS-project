<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="style.css" rel="stylesheet">
    <script src="script.js" type="module"></script>
</head>

<body>
    <div class="mainbox">
        <div class="inputbox">
            <input type="text" id="Height">
        </div>
        <div class="btns">
            <button class="allclear allbtn">AC</button>
            <button class="percent allbtn">%</button>
            <button class="backspace allbtn">back</button>
            <button class="divide allbtn">/</button>
            <button class="seven allbtn">7</button>
            <button class="eight allbtn">8</button>
            <button class="nine allbtn">9</button>
            <button class="into allbtn">*</button>
            <button class="four allbtn">4</button>
            <button class="five allbtn">5</button>
            <button class="six allbtn">6</button>
            <button class="minus allbtn">-</button>
            <button class="one allbtn">1</button>
            <button class="two allbtn">2</button>
            <button class="three allbtn">3</button>
            <button class="add allbtn">+</button>
            <button class="dblzero allbtn">0</button>
            <button class="zero allbtn">00</button>
            <button class="dot allbtn">.</button>
            <button class="equal allbtn">=</button>
        </div>
    </div>
</body>

</html>
