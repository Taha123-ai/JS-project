<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">

</head>

<body style="background-color: rgb(229, 196, 196);">
    <!-- <h1 style="color: white;" class="heading">Promise-Akshay saini</h1>
    <ol id="orderlistid">
        
    </ol> -->
    <div class="main-box">
    
    <div class="searchbox">
        <input type="text" id="inputbox" placeholder="Movie name" class="">
        <button class="button">
            <span>🔍</span>
        </button>  
    </div>
    <div class="error"></div>
    <div class="loading">loading...</div>
<div class="divopen">
    <div class="movie-card">

        <img id="Poster" class="image"
            src="">

        <div class="movie-details">

            <h1 id="Title" class="moviename">
                Movie Title
            </h1>

            <p id="Director" class="dirname">
                Director Name
            </p>

            <div class="movie-meta">
                <span id="Year">2025</span>
                <span id="Genre">Action</span>
                <span id="Runtime">120 min</span>
            </div>

            <div class="rating-box">
                ⭐ IMDb:
                <span id="imdbRating">8.4</span>
            </div>

            <p id="Plot" class="plot">
                Movie plot will appear here...
            </p>

        </div>

    </div>

    <div class="ratings">

        <div class="rating-item">
            IMDb:
            <span id="imdbRating"></span>
        </div>

        <div class="rating-item">
            Rotten:
            <span id="RottenTomatoes"></span>
        </div>

        <div class="rating-item">
            Metacritic:
            <span id="Metacritic"></span>
        </div>

    </div>

    <table class="movie-table">

        <tr>
            <th>Released</th>
            <td id="Released"></td>
        </tr>

        <tr>
            <th>Genre</th>
            <td id="Genre"></td>
        </tr>

        <tr>
            <th>Imdb-votes</th>
            <td id="imdbVotes"></td>
        </tr>

        <tr>
            <th>Director</th>
            <td id="Director"></td>
        </tr>

        <tr>
            <th>Writer</th>
            <td id="Writer"></td>
        </tr>

        <tr>
            <th>Actors</th>
            <td id="Actors"></td>
        </tr>

        <tr>
            <th>Language</th>
            <td id="Language"></td>
        </tr>

        <tr>
            <th>Country</th>
            <td id="Country"></td>
        </tr>

        <tr>
            <th>Awards</th>
            <td id="Awards"></td>
        </tr>

        <tr>
            <th>Box Office</th>
            <td id="BoxOffice"></td>
        </tr>

    </table>
</div>
</div>
    <script src="script2.js" type="module"></script>
</body>

</html>
